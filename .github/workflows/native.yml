# Builds the native game (CMakeLists.txt) on each platform it targets, with the script
# that builds and starts it there (tools/run.sh, tools/run.cmd), and checks that the
# emulation of the original's floating point gives the same bits there
# (tests/x87_test.cpp). The replay test itself needs the game's data, so it runs
# locally (tools/compat.py).
name: native

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: windows-x64-msvc
            os: windows-2022
          - name: macos-arm64
            os: macos-15
          - name: macos-x64
            os: macos-15-intel
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # As toolchain/native.Dockerfile: what SDL3's back ends need to build.
          sudo apt-get install -y ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl-dev libgl-dev libgles-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev \
            libibus-1.0-dev
      # With the compilers here, not in docker as the script would without them.
      - name: Build
        if: runner.os != 'Windows'
        env:
          EFZ_BUILD: host
        run: tools/run.sh --build-only
      - name: Build
        if: runner.os == 'Windows'
        run: tools\run.cmd --build-only
      - name: Test
        run: ctest --test-dir build/run --build-config RelWithDebInfo --output-on-failure
      # The script starts the game it built, which finds no game data here: it says so
      # and exits with 1, and the script passes both on.
      - name: Start
        if: runner.os != 'Windows'
        env:
          EFZ_BUILD: host
        run: |
          mkdir empty
          status=0
          tools/run.sh --data empty > start.txt 2>&1 || status=$?
          cat start.txt
          [ $status = 1 ] && grep -q 'no game data' start.txt
      - name: Start
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir empty
          call tools\run.cmd --data empty > start.txt 2>&1
          set status=%errorlevel%
          type start.txt
          if not "%status%"=="1" exit /b 1
          findstr /c:"no game data" start.txt
      - uses: actions/upload-artifact@v4
        with:
          name: efz-${{ matrix.name }}
          path: |
            build/run/efz
            build/run/efz.exe
            build/run/RelWithDebInfo/efz.exe
            build/run/efz.app
          if-no-files-found: ignore
