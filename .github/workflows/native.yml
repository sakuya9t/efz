# Builds the native game (CMakeLists.txt) on each platform it targets and checks that the
# emulation of the original's floating point gives the same bits there
# (tests/x87_test.cpp). The replay test itself needs the game's data, so it runs
# locally (tools/compat.py).
name: native

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: windows-x64-msvc
            os: windows-2022
          - name: macos-arm64
            os: macos-14
          - name: macos-x64
            os: macos-15-intel
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # As toolchain/native.Dockerfile: what SDL3's back ends need to build.
          sudo apt-get install -y ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl-dev libgl-dev libgles-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev \
            libibus-1.0-dev
      - name: Configure
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/native --config Release --parallel
      - name: Test
        run: ctest --test-dir build/native --build-config Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: efz-${{ matrix.name }}
          path: |
            build/native/efz
            build/native/efz.exe
            build/native/Release/efz.exe
            build/native/efz.app
          if-no-files-found: ignore
