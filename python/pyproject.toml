[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "efz_env"
version = "0.1.0"
description = "Headless EFZ for training agents: batches of matches stepped in parallel in C++"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
gym = ["gymnasium>=1.0"]

[tool.setuptools]
packages = ["efz_env"]

[tool.setuptools.package-data]
# The library, if copied next to the package (see docs/headless.md).
efz_env = ["*.dll", "*.so", "*.dylib"]
